server {
    listen 3000;
    server_name localhost;

    # ── API proxy ────────────────────────────────────────────────────────
    # Everything under /api is passed straight to the Express backend, so both
    # front ends can call same-origin /api without CORS or a second origin.
    location /api/ {
        proxy_pass http://backend:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    root /usr/share/nginx/html;

    # ── Ops console (internal) ───────────────────────────────────────────
    # The ops bundle lives in /ops so the customer site can own the root.
    location /ops {
        alias /usr/share/nginx/ops;
        index index.html;
        try_files $uri $uri/ /ops/index.html;
    }

    # ── Customer site ────────────────────────────────────────────────────
    # Multi-page, no bundler: extensionless routes resolve to their .html file,
    # which is what the nav links use (/services, /book, /track …).
    location / {
        index index.html;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Shared assets are small and change with each deploy; don't pin them.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Leaflet is loaded from a CDN by the browser, so the console and the
    # coverage map both need outbound network access — no server-side proxy.
    add_header Access-Control-Allow-Origin "http://localhost:3000" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
}